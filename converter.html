<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Scalable Image Converter | Ultra-Fast WebP Optimizer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body>
    <div class="glass-bg"></div>

    <nav class="breadcrumb">
        <a href="index.html">← Back to Portal</a>
    </nav>

    <main class="app-container">
        <header class="hero">
            <h1 class="glitch-text">Ultra-HD Pixel Machine</h1>
            <p class="subtitle">Binary Search Quality. Pixel-Aware Sharpening. 10-100KB Master.</p>
        </header>

        <section class="converter-box" id="drop-zone">
            <div class="upload-area">
                <div class="icon-pulse">
                    <svg viewBox="0 0 24 24" width="60" height="60" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" />
                    </svg>
                </div>
                <h3>Drag & Drop Images</h3>
                <p>Support for PNG, JPG, HEIC, TIFF</p>
                <input type="file" id="file-input" multiple accept="image/*" hidden>
                <button class="btn-primary" onclick="document.getElementById('file-input').click()">Browse
                    Files</button>
            </div>
        </section>

        <section class="processing-view hidden" id="processing-view">
            <div class="preview-grid" id="preview-grid">
                <!-- Image Cards will be injected here -->
            </div>

            <div class="global-controls">
                <div class="control-group">
                    <label>Max Dimension:</label>
                    <div class="preset-group">
                        <button class="btn-preset" id="preset-none" data-maxdim="0">Original</button>
                        <button class="btn-preset active" id="preset-hero" data-maxdim="1920">Hero (1920px)</button>
                        <button class="btn-preset" id="preset-content" data-maxdim="1200">Content (1200px)</button>
                        <button class="btn-preset" id="preset-thumb" data-maxdim="600">Thumb (600px)</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>Quality: <span id="quality-val">85</span>%</label>
                    <input type="range" id="quality-slider" min="1" max="100" value="85">
                </div>
                <div class="target-indicator">
                    <span class="pulse-dot"></span>
                    Target: 10KB - 100KB (HD Smart)
                </div>
                <div class="download-actions">
                    <button class="btn-download-all" id="download-all">Convert & Download All</button>
                    <button class="btn-download-zip" id="download-zip">📦 Download as ZIP</button>
                </div>
            </div>
        </section>

        <footer class="footer">
            <p>Built with Browser-Native Processing &copy; 2026</p>
        </footer>
    </main>

    <!-- Cropping Modal -->
    <div class="modal hidden" id="crop-modal">
        <div class="modal-content">
            <div class="crop-header">
                <h3>Advanced Crop</h3>
                <div class="preset-group" id="aspect-presets">
                    <button class="btn-preset active" data-ratio="NaN">Free</button>
                    <button class="btn-preset" data-ratio="1">1:1 (Square)</button>
                    <button class="btn-preset" data-ratio="1" data-circle="true">1:1 (DP)</button>
                    <button class="btn-preset" data-ratio="1.777">16:9</button>
                    <button class="btn-preset" data-ratio="0.5625">9:16</button>
                    <button class="btn-preset" data-ratio="1.777" data-res="1200,675">1200x675</button>
                </div>
            </div>
            <div id="crop-wrapper"></div>
            <div class="modal-actions">
                <button class="btn-secondary" id="cancel-crop">Cancel</button>
                <button class="btn-primary" id="apply-crop">Apply Crop</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
