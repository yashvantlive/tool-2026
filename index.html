<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Tool Portal | High-Performance Utilities</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="glass-bg"></div>

    <main class="app-container portal-container">
        <header class="hero">
            <h1 class="glitch-text">2026 Tool Portal</h1>
            <p class="subtitle">Google Fast. Browser Native. No Lag. Premium Tools.</p>
        </header>

        <section class="portal-grid">
            <!-- Image Converter Card -->
            <a href="converter.html" class="tool-card">
                <div class="tool-icon">
                    <svg viewBox="0 0 24 24" width="60" height="60" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <polyline points="21 15 16 10 5 21" />
                    </svg>
                </div>
                <h3>Image Converter</h3>
                <p>Convert any image to Full HD WebP. Smart AI compression & Advanced Cropping.</p>
                <div class="card-glow"></div>
            </a>

            <!-- Icons Generator Card -->
            <a href="icons.html" class="tool-card">
                <div class="tool-icon">
                    <svg viewBox="0 0 24 24" width="60" height="60" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <path d="M7 7h.01M17 7h.01M7 17h.01M17 17h.01" />
                        <rect x="7" y="7" width="10" height="10" rx="1" />
                    </svg>
                </div>
                <h3>Icons Generator</h3>
                <p>Generate Favicons & App Icons for iOS, Android, and Web instantly.</p>
                <div class="card-glow"></div>
            </a>
        </section>

        <footer class="footer">
            <p>Built with Browser-Native Processing &copy; 2026</p>
        </footer>
    </main>

    <script>
        // Simple hover effect for cards
        document.querySelectorAll('.tool-card').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.querySelector('.card-glow').style.setProperty('--x', `${x}px`);
                card.querySelector('.card-glow').style.setProperty('--y', `${y}px`);
            });
        });
    </script>
</body>

</html>
