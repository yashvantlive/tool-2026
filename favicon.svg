<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5b9cff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="#0a0a0f" rx="15"/>
  
  <!-- Lightning Bolt -->
  <path d="M 55 10 L 35 50 L 50 50 L 45 90 L 75 40 L 60 40 Z" 
        fill="url(#grad1)" 
        stroke="#00f5ff" 
        stroke-width="1.5"
        stroke-linejoin="round"/>
  
  <!-- Glow effect -->
  <path d="M 55 10 L 35 50 L 50 50 L 45 90 L 75 40 L 60 40 Z" 
        fill="none" 
        stroke="#00f5ff" 
        stroke-width="3"
        stroke-linejoin="round"
        opacity="0.3"
        filter="blur(2px)"/>
</svg>
